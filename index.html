<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-skrivare – Steg-för-steg</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .step { margin-bottom: 30px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .step img { width: 100%; max-width: 450px; display: block; margin-bottom: 10px; }
        .step button { margin-bottom: 10px; padding: 8px 16px; }
        #progress { width: 100%; height: 20px; background: #ddd; border-radius: 10px; margin-bottom: 20px; }
        #progress-bar { height: 100%; width: 0%; background: #4CAF50; border-radius: 10px; }
    </style>
</head>
<body>

<h1>3D-skrivare – Steg för steg</h1>
<p>Följ varje steg med bild, instruktion och ljud.</p>

<div id="progress"><div id="progress-bar"></div></div>

<script>
let completedSteps = 0;
const totalSteps = 12;

function updateProgress() {
    completedSteps++;
    const percentage = (completedSteps / totalSteps) * 100;
    document.getElementById("progress-bar").style.width = percentage + "%";
}
</script>

<!-- STEG 1–12 -->
<script>
function createStep(number, text) {
    document.write(`
        <div class="step">
            <h2>Steg ${number}</h2>
            <p>${text}</p>
            <img src="steg${number}.png" alt="Steg ${number}">
            <button onclick="document.getElementById('audio${number}').play()">▶️ Spela upp instruktion</button><br>
            <audio id="audio${number}" src="steg${number}.m4a"></audio>
            <label>
                <input type="checkbox" onchange="updateProgress()"> Markera som klar
            </label>
        </div>
    `);
}
</script>

<script>
createStep(1, "Öppna programmet <strong>Bambu Lab</strong> på datorn.");
createStep(2, "Importera din 3D-modell genom att välja <strong>.stl-filen</strong>.");
createStep(3, "Välj rätt skrivare: <strong>Bambu Lab P1S</strong>.");
createStep(4, "Använd <strong>Move</strong> för att flytta modellen till rätt position.");
createStep(5, "Använd <strong>Rotate</strong> för att vrida modellen och göra den stabil.");
createStep(6, "Använd <strong>Scale</strong> om du behöver justera storleken på modellen.");
createStep(7, "Kontrollera att rätt material är valt på <strong>filamentet</strong>.");
createStep(8, "Förbered modellen för utskrift genom att klicka <strong>Prepare</strong>.");
createStep(9, "Lägg till <strong>Support</strong> för delar som hänger eller behöver stöd.");
createStep(10, "Exportera modellen till <strong>USB-minne eller SD-kort</strong>.");
createStep(11, "Sätt i USB/SD i skrivaren och öppna <strong>Filmenyn</strong>.");
createStep(12, "Välj din fil, tryck <strong>OK</strong> och sedan <strong>Print</strong>.");
</script>

</body>
</html>
